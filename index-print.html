<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Crystal's Art School — Wireframes (print)</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Permanent+Marker&family=Caveat:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles-v5.css?v=9" />
<style>
  /* PRINT-SPECIFIC OVERRIDES
     - Each variant becomes its own printed page
     - Remove all interactive chrome (tabs, thumb strip, controls)
     - Force colors on (annotations, placeholder tints, brand swatches) */
  @page { size: A4 landscape; margin: 8mm; }

  html, body {
    background: #ffffff !important;
    margin: 0;
    padding: 0;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .print-doc {
    max-width: none;
    margin: 0;
    padding: 0;
  }

  /* One page per variant */
  .print-page {
    page-break-after: always;
    break-after: page;
    padding: 6mm 4mm 10mm;
    position: relative;
  }
  .print-page:last-child { page-break-after: auto; break-after: auto; }

  .print-page-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 2px solid var(--line);
    padding-bottom: 6px;
    margin-bottom: 10px;
  }
  .print-page-header .pp-kicker {
    font-family: "Quicksand", sans-serif;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .print-page-header .pp-title {
    font-family: "Permanent Marker", cursive;
    font-size: 22px;
    margin: 2px 0 0;
    line-height: 1.1;
  }
  .print-page-header .pp-caption {
    font-family: "Quicksand", sans-serif;
    font-size: 11px;
    max-width: 58%;
    color: var(--ink);
    line-height: 1.4;
    text-align: right;
  }
  .print-page-footer {
    position: absolute;
    left: 4mm; right: 4mm; bottom: 2mm;
    display: flex;
    justify-content: space-between;
    font-family: "Quicksand", sans-serif;
    font-size: 9px;
    color: var(--muted);
    border-top: 1px dashed var(--line-soft);
    padding-top: 2px;
  }

  /* The captured variant markup is a .wf — scale it to fit the landscape page */
  .print-stage {
    /* The content is built at a nominal desktop 1200 width. */
    width: 1200px;
    transform-origin: top left;
    /* A4 landscape at 8mm margin ≈ 281mm wide → ~1062px @ 96dpi.
       Scale 1200 → 1060 so it fits. */
    transform: scale(0.82);
    /* Give the scaled block enough vertical room */
    height: auto;
  }
  .print-stage .wf {
    width: 1200px !important;
    margin: 0 !important;
    padding: 10px 16px !important;
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 6px;
  }

  /* Hide anything interactive that might sneak through */
  .print-doc button, .print-doc .controls, .print-doc #tabs,
  .print-doc .compare-strip, .print-doc .tab-row,
  .print-doc .wf-footer { display: none !important; }

  /* Cover/TOC page */
  .cover-page {
    page-break-after: always;
    break-after: page;
    padding: 30mm 20mm 20mm;
    font-family: "Quicksand", sans-serif;
    min-height: 180mm;
  }
  .cover-page h1 {
    font-family: "Permanent Marker", cursive;
    font-size: 58px;
    margin: 0 0 6px;
    line-height: 1;
  }
  .cover-page .sub { color: var(--muted); font-size: 14px; margin-bottom: 32px; }
  .cover-page .toc {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px 28px;
    margin-top: 24px;
  }
  .cover-page .toc-section {
    border-top: 2px solid var(--line);
    padding-top: 6px;
  }
  .cover-page .toc-section h3 {
    font-family: "Permanent Marker", cursive;
    font-size: 18px;
    margin: 0 0 6px;
  }
  .cover-page .toc-section ol {
    margin: 0; padding-left: 18px;
    font-size: 12px;
    line-height: 1.8;
  }
  .cover-page .meta {
    margin-top: 30px;
    display: flex; justify-content: space-between;
    font-size: 10px; color: var(--muted);
    border-top: 1px dashed var(--line-soft);
    padding-top: 8px;
  }

  /* For screen preview */
  @media screen {
    body { background: #eae5d7; padding: 20px; }
    .print-doc { background: white; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
    .print-page, .cover-page { border-bottom: 1px dashed #ccc; }
  }
</style>
</head>
<body data-viewport="desktop" data-annot="on">

<div class="print-doc" id="print-doc">
  <!-- Cover + variant pages injected by JS -->
</div>

<!-- Load the variant library (defines window.VARIANTS) -->
<script src="variants.js?v=9"></script>

<script>
(function () {
  const doc = document.getElementById('print-doc');

  // Groups
  const SECTIONS = [
    { title: "Front Page", prefix: "F", keys: ["F1","F2","F3","F4","F5"] },
    { title: "Lesson Page", prefix: "L", keys: ["L1","L2","L3","L4"] },
    { title: "Account & Content", prefix: "A", keys: ["A1","A2","A3","A4","A5","A6","A7"] }
  ];

  // --- Cover / TOC page ---
  const cover = document.createElement('section');
  cover.className = 'cover-page';
  cover.innerHTML = `
    <h1>Crystal's Art School<br/><span style="font-size:34px;color:var(--muted);">Wireframe Exploration</span></h1>
    <div class="sub">v0.3 · Apr 2026 · Low-fi structural explorations — Front × 5 · Lesson × 4 · Account × 7</div>
    <div style="font-size:13px;max-width:720px;line-height:1.55;">
      Sixteen wireframe variants across three page groups. Every page here is structural only —
      boxes, type and annotations — no final visual design. Use these as a map of what each screen
      does and how the sections sit together; the brand-accurate UI comes later.
    </div>
    <div class="toc">
      ${SECTIONS.map(s => `
        <div class="toc-section">
          <h3>${s.title}</h3>
          <ol>
            ${s.keys.map(k => {
              const v = window.VARIANTS[k];
              return `<li><strong>${k}</strong> · ${v ? v.title.replace(/^[^·]+·\s*/, '') : k}</li>`;
            }).join('')}
          </ol>
        </div>
      `).join('')}
    </div>
    <div class="meta">
      <span>Crystal's Art School · wireframe exploration</span>
      <span>Fonts: Quicksand + Permanent Marker · Palette: Teal Mist · Forest · Coral · Blush Cream</span>
    </div>
  `;
  doc.appendChild(cover);

  // --- One printed page per variant ---
  SECTIONS.forEach(section => {
    section.keys.forEach((key, i) => {
      const v = window.VARIANTS[key];
      if (!v) return;
      const page = document.createElement('section');
      page.className = 'print-page';
      page.innerHTML = `
        <div class="print-page-header">
          <div>
            <div class="pp-kicker">${section.title} · variant ${i + 1} of ${section.keys.length} · ${key}</div>
            <h2 class="pp-title">${v.title}</h2>
          </div>
          <div class="pp-caption">${v.caption}</div>
        </div>
        <div class="print-stage">${v.desktop()}</div>
        <div class="print-page-footer">
          <span>Crystal's Art School · Wireframes v0.3</span>
          <span>${key} · ${v.title}</span>
        </div>
      `;
      doc.appendChild(page);
    });
  });

  // Auto-print once fonts + layout are ready
  Promise.all([
    document.fonts ? document.fonts.ready : Promise.resolve(),
    new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)))
  ]).then(() => {
    setTimeout(() => { window.print(); }, 500);
  });
})();
</script>
</body>
</html>
