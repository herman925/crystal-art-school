<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:'Oswald',sans-serif;background:#ede1d0;color:#474138;display:flex;gap:40px;justify-content:center;align-items:flex-start;padding:50px 30px;flex-wrap:wrap}
.card{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);padding:24px;width:300px}
.card h3{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#9a6436;margin:0 0 14px}
.card img{width:100%;height:360px;object-fit:contain;display:block}
.dark{background:#1b1814}
.dark h3{color:#cab389}
</style></head><body>
<div class="card"><h3>Tonal black (keeps shading)</h3><img src="img/deer-black.svg" alt=""></div>
<div class="card"><h3>Flat silhouette</h3><img src="img/deer-silhouette.svg" alt=""></div>
<div class="card dark"><h3>Tonal on dark (theme D)</h3><img src="img/deer-black.svg" alt=""></div>
</body></html>
